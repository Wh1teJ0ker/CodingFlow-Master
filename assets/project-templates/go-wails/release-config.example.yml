# Release 配置示例
# 非权威实例，仅说明可选能力的开关与变量来源。
# 复制到目标项目后替换 <REPLACE:...> 占位符并按真实能力裁剪。

project:
  name: "<REPLACE:PROJECT_NAME>"
  go_module_path: "<REPLACE:GO_MODULE_PATH>"
  # 唯一版本源：wails.json 的 info.productVersion
  version_source: "wails.json"

toolchain:
  node_version: "<REPLACE:NODE_VERSION>"
  wails_version: "<REPLACE:WAILS_VERSION>"
  webkit_package: "<REPLACE:WEBKIT_PACKAGE>"

platforms:
  - os: ubuntu-latest
    label: linux-amd64
    archive: tar.gz
  - os: windows-latest
    label: windows-amd64
    archive: zip
  - os: macos-latest
    label: macos-universal
    archive: zip

ldflags:
  version_var: "<REPLACE:GO_MODULE_PATH>/internal/buildinfo.Version"
  commit_var: "<REPLACE:GO_MODULE_PATH>/internal/buildinfo.Commit"
  date_var: "<REPLACE:GO_MODULE_PATH>/internal/buildinfo.BuildDate"

artifacts:
  naming_pattern: "<REPLACE:PROJECT_NAME>_<VERSION>_<PLATFORM>_<ARCH>.<EXT>"
  checksum_algorithm: sha256
  checksum_file: checksums.txt

optional:
  # 代码签名/公证（可选扩展，启用时需提供凭据）
  signing:
    enabled: "<REPLACE:ENABLE_SIGNING>"

gates:
  # 发布前必须存在的 Release QA 报告路径模板
  qa_report_pattern: "docs/qa/versions/<VERSION>/QA-审计报告.md"
  required_qa_conclusion: qa_passed
  changelog_path_pattern: "docs/versions/<VERSION>/更新日志.md"
