name: CI

# 模板变量见同目录 TEMPLATE-VARIABLES.md。
# 复制到目标项目后替换所有 <REPLACE:...> 占位符为真实值。
# 标量位置的占位符用引号包裹，保证 YAML 可解析。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test + vet + frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "<REPLACE:NODE_VERSION>"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            "<REPLACE:WEBKIT_PACKAGE>"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@"<REPLACE:WAILS_VERSION>"

      - name: Wails smoke build
        run: wails build -platform linux/amd64

  build:
    name: Build smoke (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
          - os: windows-latest
            label: windows-amd64
          - os: macos-latest
            label: macos-universal
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "<REPLACE:NODE_VERSION>"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            "<REPLACE:WEBKIT_PACKAGE>"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@"<REPLACE:WAILS_VERSION>"

      - name: Wails smoke build
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            wails build -platform windows/amd64
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            wails build -platform darwin/universal
          else
            wails build -platform linux/amd64
          fi
