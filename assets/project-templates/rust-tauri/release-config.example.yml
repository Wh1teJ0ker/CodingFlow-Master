# Release 配置示例
# 非权威实例，仅说明可选能力的开关与变量来源。
# 复制到目标项目后替换 <REPLACE:...> 占位符并按真实能力裁剪。

project:
  name: "<REPLACE:PROJECT_NAME>"
  # 唯一版本源：src-tauri/tauri.conf.json 的 version 字段
  version_source: "src-tauri/tauri.conf.json"

platforms:
  - target: x86_64-unknown-linux-gnu
    runner: ubuntu-latest
    label: linux-x64
  - target: aarch64-apple-darwin
    runner: macos-latest
    label: macos-arm64
  - target: x86_64-apple-darwin
    runner: macos-latest
    label: macos-x64
  - target: x86_64-pc-windows-msvc
    runner: windows-latest
    label: windows-x64

artifacts:
  naming_pattern: "<REPLACE:PROJECT_NAME>_<VERSION>_<PLATFORM>_<ARCH>.<EXT>"
  checksum_algorithm: sha256
  checksum_file: checksums.txt

optional:
  # Tauri updater：启用时需配置签名 secret
  updater:
    enabled: "<REPLACE:ENABLE_UPDATER>"
    signing_secret_name: TAURI_SIGNING_PRIVATE_KEY
    signing_password_secret_name: TAURI_SIGNING_PRIVATE_KEY_PASSWORD
    upload_updater_json: true
  # Windows portable 二进制（可选）
  portable:
    enabled: "<REPLACE:ENABLE_PORTABLE>"
    suffix: portable
  # 代码签名/公证（可选扩展，启用时需提供凭据）
  signing:
    enabled: "<REPLACE:ENABLE_SIGNING>"

gates:
  # 发布前必须存在的 Release QA 报告路径模板
  qa_report_pattern: "docs/qa/versions/<VERSION>/QA-审计报告.md"
  required_qa_conclusion: qa_passed
  changelog_path_pattern: "docs/versions/<VERSION>/更新日志.md"
