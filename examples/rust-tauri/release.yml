name: Release

# 非权威实例：基于 assets/project-templates/rust-tauri/.github/workflows/release.yml 填充脱敏示例值。
# updater/signing 未启用（最小可用实例）。
# 规范见 references/RUST-TAURI.md、references/RELEASE-STANDARD.md、references/GITHUB-ACTIONS-STANDARD.md。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver tag: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tauri.conf.json
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Version mismatch: tag=$EXPECTED tauri.conf.json=$ACTUAL"
            exit 1
          fi

      - name: Verify Release QA passed
        run: |
          REPORT="docs/qa/versions/${{ steps.version.outputs.version }}/QA-审计报告.md"
          if [[ ! -f "$REPORT" ]]; then
            echo "Missing Release QA report: $REPORT"
            exit 1
          fi
          if ! grep -q "qa_passed" "$REPORT"; then
            echo "Release QA report does not conclude qa_passed: $REPORT"
            exit 1
          fi

  create-release:
    name: Create draft Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/versions/${{ needs.validate.outputs.version }}/更新日志.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    name: Build & upload (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.81.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get remove -y libappindicator3-dev libappindicator3-1 || true
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/${{ matrix.target }}/release/*.app
            src-tauri/target/${{ matrix.target }}/release/*.dmg
            src-tauri/target/${{ matrix.target }}/release/*.exe
            src-tauri/target/${{ matrix.target }}/release/*.msi
          if-no-files-found: error

  checksums:
    name: Generate SHA-256 checksums
    needs: build-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tauri-bundle-*
          merge-multiple: true

      - name: Verify artifacts exist
        run: |
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app' -o -name '*.exe' -o -name '*.msi' \) -print
          if ! find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app' -o -name '*.exe' -o -name '*.msi' \) | grep -q .; then
            echo "No release artifacts found"
            exit 1
          fi

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app' -o -name '*.exe' -o -name '*.msi' \) -exec sha256sum {} \; | sed 's|  \./|  |' > checksums.txt
          cat checksums.txt

      - name: Upload checksums to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    name: Finalize release
    needs: [validate, create-release, build-tauri, checksums]
    if: ${{ needs.validate.result == 'success' && needs.create-release.result == 'success' && needs.build-tauri.result == 'success' && needs.checksums.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          args=(release edit "$TAG_NAME" --draft=false)
          if [[ "$TAG_NAME" != *-* ]]; then
            args+=(--latest)
          fi
          gh "${args[@]}"
